name: Release

# Builds a WoW-installable ReforgedBreakTimer-<version>.zip.
#
# - Push a tag like "v3.0.1" to validate, build, and publish it as a GitHub
#   Release automatically.
# - Or run this workflow manually (Actions tab -> Release -> Run workflow)
#   to just produce a downloadable build artifact, e.g. to sanity-check a
#   branch before tagging it.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on this test build (e.g. 3.1.0). Leave blank to reuse the .toc's current ## Version."
        required: false
        default: ""

env:
  ADDON_NAME: ReforgedBreakTimer

jobs:
  validate:
    name: Validate Lua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ubuntu's own lua5.1 package -- ships lua5.1/luac5.1 under those exact
      # names (unlike some third-party setup actions, which install generic
      # lua/luac and break scripts written for the versioned names).
      - name: Install Lua 5.1 and luacheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks --lua-version=5.1 install luacheck

      - name: Syntax-check every .lua file
        run: |
          set -euo pipefail
          for f in *.lua; do
            echo "luac5.1 -p $f"
            luac5.1 -p "$f"
          done

      - name: Lint with luacheck
        run: luacheck Images.lua "${ADDON_NAME}.lua" Options.lua

  release:
    name: Build release zip
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            if [ -z "$VERSION" ]; then
              VERSION=$(grep -oP '(?<=## Version: ).*' "${ADDON_NAME}.toc" | tr -d '\r')
            fi
          fi
          echo "Building version $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stage addon files
        run: |
          set -euo pipefail
          STAGE="dist/${ADDON_NAME}"
          mkdir -p "$STAGE"

          # Ship exactly what scripts/deploy_to_wow.ps1 deploys locally: the
          # .toc, every file it lists, and images/ -- never images-src/,
          # scripts/, or other repo tooling.
          cp "${ADDON_NAME}.toc" "$STAGE/"
          # The `|| [ -n "$line" ]` clause is required: without it, `read`
          # silently skips a final line that has no trailing newline (which
          # is exactly how this bit us once already with Options.lua).
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%$'\r'}"
            [ -z "$line" ] && continue
            case "$line" in \#*) continue ;; esac
            cp "$line" "$STAGE/"
          done < "${ADDON_NAME}.toc"
          cp -r images "$STAGE/"

          # Fail loudly if a listed file didn't make it into the package,
          # rather than shipping a broken zip a second time.
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%$'\r'}"
            [ -z "$line" ] && continue
            case "$line" in \#*) continue ;; esac
            if [ ! -f "$STAGE/$line" ]; then
              echo "::error::$line is listed in ${ADDON_NAME}.toc but is missing from the staged package"
              exit 1
            fi
          done < "${ADDON_NAME}.toc"

          # Stamp the packaged .toc with the release version being built.
          sed -i "s/^## Version:.*/## Version: ${{ steps.version.outputs.version }}/" "$STAGE/${ADDON_NAME}.toc"

      - name: Zip it
        run: |
          set -euo pipefail
          cd dist
          zip -rq "../${ADDON_NAME}-${{ steps.version.outputs.version }}.zip" "${ADDON_NAME}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ADDON_NAME }}-${{ steps.version.outputs.version }}
          path: ${{ env.ADDON_NAME }}-${{ steps.version.outputs.version }}.zip

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ADDON_NAME }}-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
